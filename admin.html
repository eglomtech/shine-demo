<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex">
<title>Shine Catering Admin</title>
<link rel="icon" href="images/icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Noto+Sans+Ethiopic:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{--char:#26282B;--cream:#FBF7EE;--gold:#C9962B;--line:#E8E0CF;--sand:#F1E8D4;--bad:#B3261E;--ok:#2E7D4F}
*{box-sizing:border-box;margin:0}body{font:15px/1.5 "DM Sans","Noto Sans Ethiopic",system-ui,sans-serif;background:var(--cream);color:var(--char);padding-bottom:40px}
button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}input,select,textarea{font:inherit;width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;background:#fff;color:var(--char)}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:12px 16px;background:var(--char);color:var(--cream)}
.top b{font:italic 600 20px Georgia,serif;flex:1;white-space:nowrap}a.btn{text-decoration:none}.role{font-size:12px;background:var(--gold);color:#fff;border-radius:99px;padding:2px 10px;font-weight:700}
.rt{display:flex;gap:8px}.pill{border:1px solid rgba(255,255,255,.35);border-radius:99px;padding:6px 14px;font-size:13px;color:var(--cream)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding:12px 16px;max-width:1000px;margin:0 auto}.tabs button{flex:none;padding:9px 16px;border-radius:99px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px}.tabs .on{background:var(--char);color:#fff;border-color:var(--char)}
main{max-width:1000px;margin:0 auto;padding:4px 16px}
h2{font:italic 600 26px Georgia,serif;margin:6px 0 12px}html[lang=am] h2{font-family:"Noto Sans Ethiopic",sans-serif;font-style:normal;font-weight:700}
.chips{display:flex;gap:6px;overflow-x:auto;margin:8px 0}.chips button{flex:none;padding:7px 14px;border-radius:99px;border:1px solid var(--line);background:#fff;font-size:13px;font-weight:700}.chips .on{background:var(--gold);border-color:var(--gold);color:#fff}
#olist{display:grid;gap:10px;margin-top:10px}.oc{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px;box-shadow:0 4px 12px rgba(38,40,43,.05)}.oc:active{transform:scale(.99)}
.r1{display:flex;justify-content:space-between;gap:8px;align-items:center}.r2{font-size:13px;opacity:.75;margin-top:4px}
.st{text-transform:capitalize;font-size:12px;font-weight:700;padding:2px 10px;border-radius:99px;border:1.5px solid}.st-new{color:#1d5fb4;border-color:#1d5fb4}.st-quoted{color:#9a6b00;border-color:#C9962B}.st-confirmed{color:#fff;background:var(--ok);border-color:var(--ok)}.st-cancelled{color:var(--bad);border-color:var(--bad)}
.btn{display:inline-flex;align-items:center;justify-content:center;padding:12px 20px;border-radius:99px;background:var(--gold);color:#fff;font-weight:700}.btn.dk{background:var(--char)}.btn.ln{background:none;border:1.5px solid var(--char);color:var(--char)}.btn.rd{background:var(--bad)}.btn[disabled]{opacity:.5}
.ov{position:fixed;inset:0;background:rgba(20,20,22,.55);z-index:20;display:flex;align-items:flex-end;justify-content:center}.mb{background:var(--cream);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:24px 24px 0 0;padding:22px 20px 28px;position:relative}
.x{position:absolute;right:14px;top:10px;font-size:30px;line-height:1}.kv{display:grid;grid-template-columns:130px 1fr;gap:4px 10px;margin:12px 0;font-size:14px}.kv span{opacity:.6}
.box{background:var(--sand);border-radius:14px;padding:10px 14px;margin:10px 0;font-size:14px}.box b{display:block;margin-bottom:2px}.acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}.cal .h{text-align:center;font-size:12px;opacity:.6}.d{aspect-ratio:1;border-radius:10px;background:#fff;border:1px solid var(--line);font-size:14px;position:relative}.d.blk{background:#f6d9d6;border-color:var(--bad)}.d.td{outline:2px solid var(--gold)}.d.sel{background:var(--char);color:#fff}
.dc,.dq{position:absolute;bottom:5px;left:50%;width:8px;height:8px;border-radius:50%;margin-left:-4px}.dc{background:var(--ok)}.dq{background:none;border:2px solid var(--gold)}
.cm{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}.cm button{font-size:24px;padding:4px 14px}
table{width:100%;border-collapse:collapse;font-size:14px;background:#fff;border-radius:12px;overflow:hidden}th,td{padding:9px 12px;text-align:left;border-bottom:1px solid var(--line)}th{background:var(--sand);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.bar{background:var(--sand);border-radius:6px;height:10px;min-width:60px}.bar span{display:block;height:100%;background:var(--gold);border-radius:6px}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px;margin-bottom:14px;overflow-x:auto}
details{background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}summary{font-weight:700;cursor:pointer}.sc{display:grid;gap:6px;margin:10px 0;padding:10px;background:var(--sand);border-radius:12px}.sc .l{display:flex;gap:6px}
label{display:block;font-weight:700;font-size:13px;margin:10px 0 4px}.fm{max-width:420px;margin:60px auto;padding:0 20px}.er{color:var(--bad);font-size:14px;margin-top:10px}.sub{font-size:13px;opacity:.7}
#toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--char);color:#fff;padding:10px 20px;border-radius:99px;opacity:0;transition:.3s;z-index:30;pointer-events:none}#toast.on{opacity:1;transform:translate(-50%,0)}
.u{display:flex;justify-content:space-between;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:8px}
@media(min-width:700px){#olist{grid-template-columns:1fr 1fr}.ov{align-items:center}.mb{border-radius:24px}}

/* v2 */
.lg2{display:grid;grid-template-columns:1fr 1fr;min-height:100vh}
.lp{background:linear-gradient(135deg,#F8E4A3,#EBC15C 55%,#D99B26);display:flex;flex-direction:column;justify-content:center;padding:48px}
.lgo{width:64px;height:64px;border-radius:16px;background:var(--cream);padding:6px;margin-bottom:22px;box-shadow:0 8px 20px rgba(0,0,0,.12)}
.lp h1{font:700 clamp(32px,4.6vw,56px)/1.05 Georgia,serif;color:#2b2214;max-width:11ch}html[lang=am] .lp h1{font-family:"Noto Sans Ethiopic",sans-serif;font-size:clamp(28px,3.6vw,44px);line-height:1.2}
.lp p{margin-top:16px;max-width:30ch;color:#4a3d22}
.rp{position:relative;display:flex;align-items:center;justify-content:center;padding:40px 24px;background:radial-gradient(circle at 100% 0,#FFEFC2 0,transparent 45%),radial-gradient(circle at 0 100%,#FFF1CC 0,transparent 40%),#FFFDF6}
.lf{width:100%;max-width:400px}.lf h2{font:700 34px Georgia,serif;margin:0}html[lang=am] .lf h2{font-family:"Noto Sans Ethiopic",sans-serif}
.lf input{background:#E8F0FE;border-color:#EBD9A4}.lf label{color:#8a6a2a}.pwr{position:relative}.pwr input{padding-right:72px}.pwr button{position:absolute;right:14px;top:50%;transform:translateY(-50%);font-weight:700;color:#8a6410;font-size:13px}
.btn.gold{background:linear-gradient(90deg,#F0CF73,#D99B26);color:#2b2214;border:1px solid #E5C264}.btn.wide{width:100%;margin-top:18px;padding:15px}
.lgl{position:absolute;top:16px;right:16px;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;font-weight:700;font-size:13px}
.bn{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:#fff;border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom))}
.bn button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;font-size:11px;font-weight:700;color:#8a8577;border-radius:12px}
.bn svg{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.bn .on{color:var(--gold)}
main{padding-bottom:100px}
.back{font-weight:700;padding:8px 0;font-size:15px}.qrow{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0}
.qb{text-align:center;padding:12px;border-radius:14px;background:#fff;border:1px solid var(--line);font-weight:700;font-size:14px;text-decoration:none;color:var(--char)}
.cd{border-radius:18px;padding:16px;background:var(--char);color:#fff;text-align:center;margin:10px 0}.cd b{font-size:36px;display:block;line-height:1.1}.cd.soon{background:var(--gold)}.cd.past{background:#8a8577}
.tl{border-left:2px solid var(--line);margin:8px 0 0 6px;padding-left:16px}.tl div{position:relative;margin-bottom:12px}.tl div::before{content:"";position:absolute;left:-23px;top:5px;width:10px;height:10px;border-radius:50%;background:var(--gold)}.tl small{display:block;opacity:.65}
#note{min-height:90px}.cc{margin-top:10px;font-size:13px;opacity:.75}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px}.sc2{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px}.sc2 b{font-size:24px;display:block;line-height:1.2}.sc2 span{font-size:12px;opacity:.65}
.ch{width:100%;height:auto}.cv{font-size:10px;font-weight:700;fill:#26282B}.cl{font-size:10px;fill:#8a8577}
.dn{display:flex;align-items:center;gap:16px;flex-wrap:wrap}.dn svg{width:130px;flex:none}.dn ul{padding:0}.dn li{list-style:none;font-size:14px;margin:4px 0}.dn i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:8px}
@media(max-width:800px){.lg2{grid-template-columns:1fr}.lp{padding:26px 22px}.lgo{width:48px;height:48px;margin-bottom:12px}.lp h1{font-size:28px;max-width:none}.lp p{display:none}.rp{padding:28px 20px 40px;align-items:flex-start}}
@media(min-width:700px){.sum{grid-template-columns:repeat(4,1fr)}.g2{display:grid;grid-template-columns:1fr 1fr;gap:14px}.g2 .card{margin:0}}

/* v3: dark login, bigger back button, motion */
.lp{background:radial-gradient(circle at 18% 12%,rgba(201,150,43,.38),transparent 52%),radial-gradient(circle at 90% 95%,rgba(201,150,43,.18),transparent 45%),linear-gradient(160deg,#33363A,#1c1e20);align-items:flex-start}
.lp h1{color:var(--cream)}.lp p{color:rgba(251,247,238,.78)}
.lgo{width:116px;height:116px;border-radius:50%;background:#fff;padding:7px;object-fit:contain;box-shadow:0 10px 30px rgba(0,0,0,.35),0 0 0 4px rgba(201,150,43,.55);margin-bottom:26px}
@media(max-width:800px){.lgo{width:76px;height:76px;margin-bottom:14px}.lp{padding:24px 22px 28px}}
input:focus,textarea:focus,select:focus{outline:0;border-color:var(--gold);box-shadow:0 0 0 4px rgba(201,150,43,.2)}
input,textarea,select{transition:border-color .2s,box-shadow .2s}
.back{display:inline-flex;align-items:center;gap:12px;font-size:19px;font-weight:700;padding:4px 0 8px}
.bk{width:48px;height:48px;border-radius:50%;background:#fff;border:1px solid var(--line);display:grid;place-items:center;box-shadow:0 4px 12px rgba(38,40,43,.08);transition:background .2s,transform .2s,border-color .2s}
.bk svg{width:26px;height:26px;fill:none;stroke:var(--char);stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;transition:transform .2s,stroke .2s}
.back:hover .bk{background:var(--gold);border-color:var(--gold)}.back:hover .bk svg{stroke:#fff;transform:translateX(-3px)}.back:active .bk{transform:scale(.92)}
.qb{display:flex;align-items:center;justify-content:center;gap:8px;font-size:14px;padding:15px 6px;white-space:nowrap;transition:transform .2s,background .2s,color .2s,box-shadow .2s}
.qb svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.qb:hover{background:var(--char);color:#fff;transform:translateY(-3px);box-shadow:0 10px 22px rgba(38,40,43,.2)}.qb:active{transform:scale(.96)}
@keyframes fu{from{opacity:0;transform:translateY(16px)}}
@keyframes pop3{0%{transform:scale(.7)}60%{transform:scale(1.15)}100%{transform:scale(1)}}
@keyframes growy{from{transform:scaleY(0)}}@keyframes growx{from{transform:scaleX(0)}}
@keyframes ring{from{opacity:0;transform:rotate(-140deg) scale(.6)}}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(201,150,43,.55)}100%{box-shadow:0 0 0 16px rgba(201,150,43,0)}}
@keyframes flo{50%{transform:translateY(-8px)}}
#view.an>*{animation:fu .5s cubic-bezier(.2,.8,.2,1) backwards}
#view.an>*:nth-child(2){animation-delay:.06s}#view.an>*:nth-child(3){animation-delay:.12s}#view.an>*:nth-child(4){animation-delay:.18s}#view.an>*:nth-child(5){animation-delay:.24s}#view.an>*:nth-child(n+6){animation-delay:.3s}
.oc.an{animation:fu .45s cubic-bezier(.2,.8,.2,1) backwards}
.oc,.card,.sc2,.u,details,.chips button,.tabs button{transition:transform .2s,box-shadow .2s,border-color .2s,background .2s}
.oc:hover{transform:translateY(-3px);box-shadow:0 12px 26px rgba(38,40,43,.13);border-color:var(--gold)}
.card:hover,.u:hover,details:hover{box-shadow:0 8px 22px rgba(38,40,43,.09)}
.sc2:hover{transform:translateY(-4px);box-shadow:0 12px 24px rgba(38,40,43,.12);border-color:var(--gold)}
.chips button:hover{border-color:var(--gold);transform:translateY(-1px)}
.btn{transition:transform .15s,box-shadow .2s,filter .2s}.btn:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(38,40,43,.2);filter:brightness(1.07)}.btn:active{transform:scale(.96)}
.pill{transition:background .2s,transform .15s}.pill:hover{background:rgba(255,255,255,.14)}.pill:active{transform:scale(.94)}
.bn button{position:relative;transition:color .2s,background .2s}.bn button:hover{background:var(--sand)}.bn svg{transition:transform .25s}.bn button:hover svg{transform:translateY(-3px)}
.bn .on svg{animation:pop3 .45s}.bn .on::after{content:"";position:absolute;top:0;left:30%;right:30%;height:3px;border-radius:0 0 4px 4px;background:var(--gold);animation:growx .3s}
.cd.soon{animation:pulse 2s infinite}
.ch rect{transform-box:fill-box;transform-origin:bottom;animation:growy .8s cubic-bezier(.2,.8,.2,1) backwards}
.ch rect:nth-of-type(2){animation-delay:.08s}.ch rect:nth-of-type(3){animation-delay:.16s}.ch rect:nth-of-type(4){animation-delay:.24s}.ch rect:nth-of-type(5){animation-delay:.32s}.ch rect:nth-of-type(6){animation-delay:.4s}
.bar span{transform-origin:left;animation:growx .9s cubic-bezier(.2,.8,.2,1) backwards}
.dn svg{animation:ring 1s cubic-bezier(.2,.8,.2,1) backwards}
.lp>*{animation:fu .7s cubic-bezier(.2,.8,.2,1) backwards}.lp>*:nth-child(2){animation-delay:.12s}.lp>*:nth-child(3){animation-delay:.24s}
.lgo{animation:fu .7s backwards,flo 5s 1s ease-in-out infinite}
.lf>*{animation:fu .6s cubic-bezier(.2,.8,.2,1) backwards}.lf>*:nth-child(2){animation-delay:.07s}.lf>*:nth-child(3){animation-delay:.14s}.lf>*:nth-child(4){animation-delay:.21s}.lf>*:nth-child(5){animation-delay:.28s}.lf>*:nth-child(6){animation-delay:.35s}.lf>*:nth-child(7){animation-delay:.42s}
.btn.gold{background-size:200% 100%;transition:background-position .4s,transform .15s,box-shadow .2s}.btn.gold:hover{background-position:100% 0}
.dish,.sc{transition:transform .2s,box-shadow .2s}.sc:hover{box-shadow:0 6px 16px rgba(38,40,43,.1)}
</style></head>

  '<div>'+(owner()?'<div class="card"><label style="margin-top:0">'+t('Final price (ETB)')+'</label><input id="price" type="number" min="0" inputmode="numeric" value="'+e(dr.price!=null?dr.price:(S.quotes[id]||''))+'"><div class="acts"><button class="btn dk" data-st="quoted">'+t('Save as Quoted')+'</button><button class="btn" data-st="confirmed">'+t('Mark Confirmed')+'</button>'+(o.status==='new'?'':'<button class="btn ln" data-st="new">'+t('Reopen as New')+'</button>')+'<button class="btn rd" data-st="cancelled">'+t('Cancel order')+'</button></div></div>'+
  '<div class="card"><label style="margin-top:0">'+t('Private note (only you)')+'</label><textarea id="note">'+e(dr.note!=null?dr.note:(S.notes[id]||''))+'</textarea><div class="acts"><button class="btn ln" data-savenote>'+t('Save note')+'</button></div></div>':'')+
  '<div class="card"><b>'+t('Timeline')+'</b><div class="tl">'+tl.map(function(r){return '<div><b>'+t(r[0])+'</b><small>'+fmt(r[1])+'</small></div>'}).join('')+'</div></div></div></div>'+
  (others.length?'<h2 style="font-size:20px;margin-top:18px">'+t('Other orders from this customer')+'</h2><div id="olist">'+others.map(function(x){var vv=x.event||{};return '<button class="oc" data-o="'+x.id+'"><div class="r1"><b>#'+x.id.slice(0,6).toUpperCase()+' · '+e(x.package)+'</b><span class="st st-'+x.status+'">'+t(x.status)+'</span></div><div class="r2">'+e(vv.date)+' · '+e(vv.guests)+' '+t('guests')+'</div></button>'}).join('')+'</div>':'');
}
function fail(){toast(t('Could not save'))}
function setStatus(st){
  var id=S.sel,pe=$('#price'),p=+(pe&&pe.value||0)||S.quotes[id]||0;
  if((st==='quoted'||st==='confirmed')&&!(p>0))return toast(t('Enter the final price first'));
  var upd={status:st,updatedAt:FV.serverTimestamp()};upd[st+'At']=FV.serverTimestamp();
  var ops=[];if(p>0&&p!==S.quotes[id])ops.push(db.doc('quotes/'+id).set({price:p,updatedAt:FV.serverTimestamp()},{merge:true}));
  ops.push(db.doc('orders/'+id).update(upd));
  Promise.all(ops).then(function(){S.draft=null;toast(t('Saved'));vOrder()}).catch(fail);
}
function saveNote(){var id=S.sel;db.doc('quotes/'+id).set({note:$('#note').value,updatedAt:FV.serverTimestamp()},{merge:true}).then(function(){S.draft=null;toast(t('Saved'))}).catch(fail)}

/* ---------- menu editor ---------- */
function toEd(P){return P.map(function(p){return{id:p.id,n:p.n,inc:p.inc||'',secs:Object.keys(p.s).map(function(k){return{n:k,d:p.s[k].split('|').join('\n')}})}})}
function vMenu(){
  if(S.menu===null){$('#view').innerHTML='<p class="sub">'+t('Loading…')+'</p>';db.doc('menu/main').get().then(function(d){S.menu=[];try{if(d.exists)S.menu=toEd(JSON.parse(d.data().json))}catch(x){}if(S.tab==='menu')vMenu()}).catch(function(){S.menu=[];toast(t('No permission or connection problem'));vMenu()});return}
  var M=S.menu;
  $('#view').innerHTML='<h2>'+t('Menu')+'</h2><div class="acts" style="margin:0 0 12px"><button class="btn ln" data-m="import">'+t('Import the current menu from the customer app')+'</button></div>'+(M.length?'':'<p class="sub">'+t('The menu is empty')+'</p>')+
  M.map(function(p,i){return '<details'+(S.open===i?' open':'')+'><summary>'+e(p.n||'—')+'</summary><label>'+t('Package name')+'</label><input data-pk="'+i+'" data-k="n" value="'+e(p.n)+'"><label>'+t('What is included')+'</label><input data-pk="'+i+'" data-k="inc" value="'+e(p.inc)+'">'+
  p.secs.map(function(s,j){return '<div class="sc"><div class="l"><input data-pk="'+i+'" data-sj="'+j+'" data-k="sn" placeholder="'+e(t('Section name'))+'" value="'+e(s.n)+'"><button class="btn rd" style="padding:8px 14px" data-m="dsec" data-i="'+i+'" data-j="'+j+'">×</button></div><textarea rows="5" data-pk="'+i+'" data-sj="'+j+'" data-k="sd" placeholder="'+e(t('One dish per line'))+'">'+e(s.d)+'</textarea></div>'}).join('')+
  '<div class="acts"><button class="btn ln" data-m="asec" data-i="'+i+'">'+t('Add section')+'</button><button class="btn ln" data-m="up" data-i="'+i+'">↑ '+t('Up')+'</button><button class="btn ln" data-m="down" data-i="'+i+'">↓ '+t('Down')+'</button><button class="btn rd" data-m="dpk" data-i="'+i+'">'+t('Delete')+'</button></div></details>'}).join('')+
  '<div class="acts"><button class="btn ln" data-m="apk">'+t('Add package')+'</button><button class="btn dk" data-m="save">'+t('Save menu')+'</button></div>';
}
function menuAction(a,i,j){
  var M=S.menu;i=+i;j=+j;
  if(a==='apk'){M.push({id:'',n:'',inc:'',secs:[{n:'',d:''}]});S.open=M.length-1}
  if(a==='asec'){M[i].secs.push({n:'',d:''});S.open=i}
  if(a==='dsec'){M[i].secs.splice(j,1);S.open=i}
  if(a==='dpk'){if(!confirm(t('Delete this package?')))return;M.splice(i,1);S.open=-1}
  if(a==='up'&&i>0){var x=M.splice(i,1)[0];M.splice(i-1,0,x);S.open=i-1}
  if(a==='down'&&i<M.length-1){var y=M.splice(i,1)[0];M.splice(i+1,0,y);S.open=i+1}
  if(a==='import')return importMenu();
  if(a==='save')return saveMenu();
  vMenu();
}
function importMenu(){
  var urls=['index.html','shine-app.html'];
  (function next(k){
    if(k>=urls.length)return toast(t('Could not find the customer app file'));
    fetch(urls[k]+'?'+Date.now()).then(function(r){return r.ok?r.text():Promise.reject()}).then(function(txt){
      var a=txt.indexOf('var P=['),b=txt.indexOf('\n];',a);S.menu=toEd((new Function('return '+txt.slice(a+6,b+2)))());S.open=-1;vMenu();
    }).catch(function(){next(k+1)});
  })(0);
}
function saveMenu(){
  var used={},P=S.menu.filter(function(p){return p.n.trim()}).map(function(p){var id=p.id||slug(p.n);while(used[id])id+='-2';used[id]=1;var s={};
    p.secs.forEach(function(x){var d=x.d.split('\n').map(function(l){return l.trim()}).filter(Boolean);if(x.n.trim()&&d.length)s[x.n.trim()]=d.join('|')});
    return{id:id,n:p.n.trim(),inc:p.inc.trim(),s:s}});
  db.doc('menu/main').set({json:JSON.stringify(P),updatedAt:FV.serverTimestamp()}).then(function(){S.menu=toEd(P);toast(t('Menu saved. Customers see it now.'))}).catch(function(){toast(t('Could not save'))});
}

/* ---------- reports ---------- */
function mk(d){return d?String(d).slice(0,7):''}
function months6(){var a=[],n=new Date();for(var i=5;i>=0;i--){var x=new Date(n.getFullYear(),n.getMonth()-i,1);a.push(x.getFullYear()+'-'+pad(x.getMonth()+1))}return a}
function barSvg(vals,labels,color,money){
  var mx=Math.max.apply(null,vals.concat([1])),bw=32,gap=(300-bw*vals.length)/(vals.length+1),o='';
  vals.forEach(function(v,i){var bh=Math.round(v/mx*95),x=gap+i*(bw+gap),y=120-bh;o+='<rect x="'+x+'" y="'+y+'" width="'+bw+'" height="'+Math.max(bh,2)+'" rx="7" fill="'+color+'"/><text x="'+(x+bw/2)+'" y="'+(y-5)+'" text-anchor="middle" class="cv">'+(money&&v>=1000?Math.round(v/1000)+'k':v)+'</text><text x="'+(x+bw/2)+'" y="138" text-anchor="middle" class="cl">'+labels[i]+'</text>'});
  return '<svg viewBox="0 0 300 145" class="ch">'+o+'</svg>';
}
function donut(parts){
  var tot=parts.reduce(function(a,x){return a+x[1]},0),r=40,C=2*Math.PI*r,acc=0,o='';
  parts.forEach(function(x){if(!x[1])return;var l=x[1]/tot*C;o+='<circle cx="60" cy="60" r="'+r+'" fill="none" stroke="'+x[2]+'" stroke-width="18" stroke-dasharray="'+l+' '+(C-l)+'" stroke-dashoffset="'+(-acc)+'" transform="rotate(-90 60 60)"/>';acc+=l});
  return '<svg viewBox="0 0 120 120">'+(tot?o:'<circle cx="60" cy="60" r="40" fill="none" stroke="#E8E0CF" stroke-width="18"/>')+'<text x="60" y="66" text-anchor="middle" style="font:700 22px sans-serif">'+tot+'</text></svg>';
}
function vRep(){
  var os=S.orders.filter(function(o){return o.status!=='cancelled'}),ms=months6(),cnt={},sales={},pk={},cu={},thisM=ms[5],st={new:0,quoted:0,confirmed:0,cancelled:0},total=0;
  S.orders.forEach(function(o){if(st[o.status]!=null)st[o.status]++});
  os.forEach(function(o){var c=o.createdAt&&o.createdAt.toDate?o.createdAt.toDate():null,m=c?c.getFullYear()+'-'+pad(c.getMonth()+1):mk(o.event&&o.event.date);if(m)cnt[m]=(cnt[m]||0)+1;
    pk[o.package]=(pk[o.package]||0)+1;
    var ph=np((o.customer||{}).phone)||o.id,r=cu[ph]=cu[ph]||{n:o.customer&&o.customer.name,p:o.customer&&o.customer.phone,c:0,s:0};r.c++;
    if(o.status==='confirmed'){var ct=o.confirmedAt||o.createdAt,cd2=ct&&ct.toDate?ct.toDate():null,em=cd2?cd2.getFullYear()+'-'+pad(cd2.getMonth()+1):mk(o.event&&o.event.date),pr=S.quotes[o.id]||0;if(em)sales[em]=(sales[em]||0)+pr;r.s+=pr;total+=pr}});
  var cus=Object.keys(cu).map(function(k){return cu[k]}).sort(function(a,b){return b.c-a.c||b.s-a.s});S.cus=cus;
  var lab=ms.map(function(m){var p=m.split('-');return new Date(+p[0],+p[1]-1,1).toLocaleDateString(L==='am'?'am-ET':'en-GB',{month:'short'})});
  var pks=Object.keys(pk).sort(function(a,b){return pk[b]-pk[a]}).slice(0,6),pm=Math.max.apply(null,pks.map(function(k){return pk[k]}).concat([1]));
  var card=function(n,l,m){return '<div class="sc2"><b data-n="'+n+'" data-m="'+(m?1:0)+'">'+(m?n.toLocaleString()+' '+t('ETB'):n)+'</b><span>'+t(l)+'</span></div>'};
  $('#view').innerHTML='<h2>'+t('Reports')+'</h2><div class="sum">'+card(os.length,'Total orders')+card(total,'Confirmed sales',1)+card(cnt[thisM]||0,'This month')+card(cus.filter(function(c){return c.c>1}).length,'Repeat customers')+'</div>'+
  '<div class="g2"><div class="card"><b>'+t('Orders per month')+'</b>'+barSvg(ms.map(function(m){return cnt[m]||0}),lab,'#C9962B')+'</div><div class="card"><b>'+t('Confirmed sales per month')+'</b>'+barSvg(ms.map(function(m){return sales[m]||0}),lab,'#2E7D4F',1)+'</div>'+
  '<div class="card"><b>'+t('Order status')+'</b><div class="dn">'+donut([['new',st.new,'#1d5fb4'],['quoted',st.quoted,'#C9962B'],['confirmed',st.confirmed,'#2E7D4F'],['cancelled',st.cancelled,'#B3261E']])+'<ul>'+[['new','#1d5fb4'],['quoted','#C9962B'],['confirmed','#2E7D4F'],['cancelled','#B3261E']].map(function(x){return '<li><i style="background:'+x[1]+'"></i>'+t(x[0])+': <b>'+st[x[0]]+'</b></li>'}).join('')+'</ul></div></div>'+
  '<div class="card"><b>'+t('Most requested packages')+'</b>'+(pks.length?'<table>'+pks.map(function(k){return '<tr><td>'+e(k)+'</td><td style="width:45%"><div class="bar"><span style="width:'+Math.round(pk[k]/pm*100)+'%"></span></div></td><td><b>'+pk[k]+'</b></td></tr>'}).join('')+'</table>':'<p class="sub">'+t('No data yet')+'</p>')+'</div></div>'+
  '<div class="card"><div class="r1"><b>'+t('Customers')+'</b><button class="btn ln" style="padding:8px 14px;font-size:13px" data-csv>⬇ '+t('Download customer list')+'</button></div><table><tr><th>'+t('Name')+'</th><th>'+t('Phone')+'</th><th>'+t('Orders count')+'</th><th>'+t('Confirmed total')+'</th></tr>'+cus.map(function(r){return '<tr><td>'+e(r.n)+(r.c>1?' <span class="st st-quoted">'+t('Repeat customer')+'</span>':'')+'</td><td><a href="tel:'+e(r.p)+'">'+e(r.p)+'</a></td><td>'+r.c+'</td><td>'+r.s.toLocaleString()+'</td></tr>'}).join('')+'</table></div>';
  if($('#view').className==='an')countUp();
}
function countUp(){$('#view').querySelectorAll('[data-n]').forEach(function(el){var n=+el.dataset.n,m=el.dataset.m==='1',z=null;function f(ts){if(!z)z=ts;var p=Math.min((ts-z)/800,1),v=Math.round(n*(1-Math.pow(1-p,3)));el.textContent=m?v.toLocaleString()+' '+t('ETB'):v;if(p<1)requestAnimationFrame(f)}requestAnimationFrame(f)})}
function csvDl(){
  var rows=[['Name','Phone','Orders','Confirmed total (ETB)','Repeat customer']].concat((S.cus||[]).map(function(r){return [r.n,r.p,r.c,r.s,r.c>1?'yes':'no']}));
  var txt='\ufeff'+rows.map(function(r){return r.map(function(x){return '"'+String(x==null?'':x).replace(/"/g,'""')+'"'}).join(',')}).join('\r\n'),a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([txt],{type:'text/csv;charset=utf-8'}));a.download='shine-customers.csv';document.body.appendChild(a);a.click();a.remove();
}

/* ---------- staff ---------- */
function vStaff(){
  $('#view').innerHTML='<h2>'+t('Staff accounts')+'</h2>'+S.users.map(function(u){var me=S.u&&u.id===S.u.uid;return '<div class="u"><div><b>'+e(u.name)+'</b> <span class="role" style="background:'+(u.role==='owner'?'var(--gold)':'var(--char)')+'">'+t(u.role==='owner'?'Owner':'Staff')+'</span><div class="sub">'+e(u.email)+' · '+t(u.active===false?'Disabled':'Active')+'</div></div>'+(u.role==='owner'||me?'':'<div class="acts" style="margin:0"><button class="btn ln" style="padding:8px 14px" data-u="'+u.id+'" data-a="'+(u.active===false?'on':'off')+'">'+t(u.active===false?'Enable':'Disable')+'</button><button class="btn rd" style="padding:8px 14px" data-u="'+u.id+'" data-a="del">'+t('Remove')+'</button></div>')+'</div>'}).join('')+
  '<div class="card" style="margin-top:16px"><b>'+t('Add staff')+'</b><label>'+t('Full name')+'</label><input id="sn"><label>'+t('Email')+'</label><input id="se" type="email"><label>'+t('Password (6 or more characters)')+'</label><input id="sp" type="password" autocomplete="new-password"><div class="acts"><button class="btn dk" id="sadd">'+t('Add staff')+'</button></div></div>';
}
function addStaff(){
  var n=$('#sn').value.trim(),m=$('#se').value.trim(),p=$('#sp').value;
  if(!n||!m||p.length<6)return toast(t('Fill in all fields'));
  var a2=firebase.apps.filter(function(x){return x.name==='sec'})[0]||firebase.initializeApp(CFG,'sec');
  a2.auth().createUserWithEmailAndPassword(m,p).then(function(c){var uid=c.user.uid;return a2.auth().signOut().then(function(){return db.doc('users/'+uid).set({role:'staff',name:n,email:m,active:true,createdAt:FV.serverTimestamp()})})}).then(function(){toast(t('Staff added'))}).catch(function(){toast(t('Could not add staff'))});
}

/* ---------- events ---------- */
document.addEventListener('click',function(ev){
  var el=ev.target,g=function(a){return el.closest(a)},n;
  if(el.id==='login'){var em=$('#em').value.trim(),pw=$('#pw').value;S.err='';auth.signInWithEmailAndPassword(em,pw).catch(function(){S.err='Wrong email or password';render()});return}
  if(el.id==='lang'){L=L==='am'?'en':'am';try{localStorage.setItem('shine_admin_lang',L)}catch(x){}render();return}
  if(el.id==='out'){auth.signOut();return}
  if(el.id==='sadd'){addStaff();return}
  if((n=g('[data-tab]'))){S.tab=n.dataset.tab;S.sel=null;render();return}
  if(el.id==='showpw'){var pi=$('#pw'),hd=pi.type==='password';pi.type=hd?'text':'password';el.textContent=t(hd?'Hide':'Show');return}
  if(g('[data-back]')){S.sel=null;S._s=null;S.draft=null;an(true);vOrders();window.scrollTo(0,0);return}
  if(g('[data-copy]')){var oo=S.orders.filter(function(x){return x.id===S.sel})[0];if(oo&&navigator.clipboard)navigator.clipboard.writeText(sumText(oo)).then(function(){toast(t('Copied'))});return}
  if(g('[data-savenote]')){saveNote();return}
  if(g('[data-csv]')){csvDl();return}
  if((n=g('[data-f]'))&&n.closest('#chips')){S.filter=n.dataset.f;drawOrders(true);return}
  if((n=g('[data-o]'))){openOrder(n.dataset.o);return}
  if((n=g('[data-st]'))){setStatus(n.dataset.st);return}
  if((n=g('[data-m]'))){menuAction(n.dataset.m,n.dataset.i,n.dataset.j);return}
  if((n=g('[data-u]'))){var id=n.dataset.u,a=n.dataset.a;(a==='del'?db.doc('users/'+id).delete():db.doc('users/'+id).update({active:a==='on'})).catch(function(){toast(t('Could not save'))});return}
});
document.addEventListener('input',function(ev){
  var el=ev.target;
  if(el.id==='q'){S.q=el.value;drawOrders();return}
  if(el.id==='price'||el.id==='note'){if(!S.draft||S.draft.id!==S.sel)S.draft={id:S.sel};S.draft[el.id]=el.value;return}
  if(el.dataset&&el.dataset.pk!==undefined&&S.menu){var p=S.menu[+el.dataset.pk],k=el.dataset.k;if(k==='n')p.n=el.value;else if(k==='inc')p.inc=el.value;else{var s=p.secs[+el.dataset.sj];if(k==='sn')s.n=el.value;else s.d=el.value}}
});
document.addEventListener('keydown',function(ev){if(ev.key==='Enter'&&(ev.target.id==='em'||ev.target.id==='pw'))document.querySelector('#login').click()});
if(SKIP_LOGIN){S.u={uid:'local'};S.role='owner';start()}
render();
</script></body></html>
